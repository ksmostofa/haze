<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>HAZE</title>
<style>
html,body{margin:0;height:100%;background:#050505;color:#e9e9e9;font-family:Arial,sans-serif;display:grid;place-items:center}
#boot{font:700 12px Arial,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:#6d7075;text-align:center;padding:24px}
</style>
</head>
<body>
<div id="boot">Summoning the haze…</div>
<script>
(async()=>{
  try{
    if(!("DecompressionStream" in window)) throw new Error("A newer browser is required to run HAZE.");
    const files=Array.from({length:10},(_,i)=>`/assets/game.${i}.b64`);
    const parts=await Promise.all(files.map(async u=>{
      const r=await fetch(u,{cache:"no-cache"});
      if(!r.ok) throw new Error("Game payload failed to load.");
      return (await r.text()).trim();
    }));
    const b64=parts.join("");
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById("boot").textContent=err?.message||"HAZE failed to load.";
  }
})();
</script>
</body>
</html>
