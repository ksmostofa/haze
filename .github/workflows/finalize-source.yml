name: Finalize HAZE source

on:
  push:
    paths:
      - '.github/workflows/finalize-source.yml'
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name == 'push' || github.event.issue.title == 'internal: finalize HAZE source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final single-file game
        run: |
          set -euo pipefail
          node build.mjs
          test -s dist/index.html
          grep -q '<title>HAZE</title>' dist/index.html
          grep -q 'haze-20260811-global-v1' dist/index.html
      - name: Remove transfer/build scaffolding
        run: |
          set -euo pipefail
          rm -rf assets
          rm -f build.mjs
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          p.scripts = { deploy: 'wrangler deploy' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          const raw = fs.readFileSync('wrangler.jsonc','utf8');
          const cfg = JSON.parse(raw);
          delete cfg.build;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(cfg, null, 2) + '\n');
          NODE
          rm -f .github/workflows/finalize-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit final repository layout
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize HAZE as single-file game source'
          git push
