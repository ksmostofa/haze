name: Verify HAZE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production build
        run: |
          npm install --ignore-scripts
          npm run build
          test -s dist/index.html
          grep -q '<title>HAZE</title>' dist/index.html
          grep -q 'requestFullscreen' dist/index.html
          grep -q '/api/leaderboard' dist/index.html
          grep -q '/api/run/complete' dist/index.html
          if grep -q 'atob(' dist/index.html; then
            echo 'Unexpected browser-side atob() found' >&2
            exit 1
          fi
      - name: Verify Worker source
        run: node --check src/worker.js
      - name: Wait briefly for Cloudflare Git deployment
        run: sleep 45
      - name: Smoke-test live Cloudflare deployment
        env:
          BASE_URL: https://haze.ksmostofa576.workers.dev
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 8 --retry-all-errors "$BASE_URL/" -o /tmp/home.html
          grep -q '<title>HAZE</title>' /tmp/home.html
          grep -q 'requestFullscreen' /tmp/home.html
          grep -q '/api/leaderboard' /tmp/home.html
          if grep -q 'atob(' /tmp/home.html; then
            echo 'Live site still contains obsolete atob loader' >&2
            exit 1
          fi
          curl -fsS "$BASE_URL/api/config" -o /tmp/config.json
          curl -fsS "$BASE_URL/api/leaderboard" -o /tmp/leaderboard.json
          python - <<'PY'
          import json
          config=json.load(open('/tmp/config.json'))
          board=json.load(open('/tmp/leaderboard.json'))
          assert 'turnstileSiteKey' in config, config
          assert isinstance(board.get('leaders'), list), board
          assert 'player' in board, board
          print('HAZE live smoke test passed')
          PY
