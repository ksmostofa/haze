name: Stanley 3D asset probe
on:
  push:
    branches: [brandmystanley-scraper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install playwright@1.55.0
      - run: npx playwright install chromium --with-deps
      - run: node scripts/scrape-stanley.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stanley-probe
          path: |
            stanley-assets.txt
            stanley-page.png
          if-no-files-found: ignore
