name: Verify HAZE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check

  live-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Cloudflare and Netlify production
        run: |
          set -euo pipefail

          verify_host() {
            BASE_URL="$1"
            LABEL="$2"
            HOME_FILE="/tmp/${LABEL}-home.html"
            CONFIG_FILE="/tmp/${LABEL}-config.json"
            BOARD_FILE="/tmp/${LABEL}-leaderboard.json"

            for attempt in {1..15}; do
              if curl -fsS "$BASE_URL/" -o "$HOME_FILE" \
                && grep -q 'BUILD_ID="haze-20260811-global-v1"' "$HOME_FILE" \
                && grep -q 'runProof' "$HOME_FILE" \
                && grep -q 'requestGameFullscreen' "$HOME_FILE" \
                && ! grep -q 'window.__HAZE' "$HOME_FILE" \
                && ! grep -q 'atob(' "$HOME_FILE"; then
                break
              fi
              if [ "$attempt" -eq 15 ]; then
                echo "$LABEL production page failed verification" >&2
                exit 1
              fi
              sleep 8
            done

            curl -fsS "$BASE_URL/api/config" -o "$CONFIG_FILE"
            curl -fsS "$BASE_URL/api/leaderboard" -o "$BOARD_FILE"

            PLAYER="ci-${LABEL}-$(date +%s)-abcdefghijklmnop"
            START=$(curl -fsS -X POST "$BASE_URL/api/run/start" \
              -H 'content-type: application/json' \
              --data "{\"playerId\":\"$PLAYER\",\"build\":\"haze-20260811-global-v1\"}")
            node - "$START" <<'NODE'
          const data = JSON.parse(process.argv[2]);
          if (typeof data.runToken !== 'string' || data.runToken.length < 16) throw new Error('ranked run start token missing');
          if (!Number.isFinite(data.startedAt)) throw new Error('ranked run start timestamp missing');
          NODE
          }

          verify_host "https://haze.ksmostofa576.workers.dev" "cloudflare"
          verify_host "https://survivethehaze.netlify.app" "netlify"

          node - <<'NODE'
          const fs = require('node:fs');
          let reference = null;
          for (const label of ['cloudflare', 'netlify']) {
            const config = JSON.parse(fs.readFileSync(`/tmp/${label}-config.json`));
            const board = JSON.parse(fs.readFileSync(`/tmp/${label}-leaderboard.json`));
            if (config.build !== 'haze-20260811-global-v1') throw new Error(`${label}: wrong live build`);
            if (config.season !== 'night-1') throw new Error(`${label}: wrong live season`);
            if (!['verified-run', 'turnstile+verified-run'].includes(config.protection)) throw new Error(`${label}: invalid protection mode`);
            if (!Array.isArray(board.leaders) || !('player' in board)) throw new Error(`${label}: invalid leaderboard response`);
            if (!reference) reference = { build: config.build, season: config.season, protection: config.protection };
            else if (config.build !== reference.build || config.season !== reference.season || config.protection !== reference.protection) throw new Error('hosts are not using the same authoritative API configuration');
            console.log(`${label} verified: ${config.protection}; ${board.leaders.length} leaders`);
          }
          NODE
