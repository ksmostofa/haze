name: Verify and Deploy HAZE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: haze-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check


  deploy:
    needs: test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Cloudflare deployment credentials
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CF_API_TOKEN" ] || { echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "$CF_ACCOUNT_ID" ] || { echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy HAZE to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy

  live-smoke:
    needs: [test, deploy]
    if: >-
      always() &&
      needs.test.result == 'success' &&
      needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify one optimized Cloudflare app through both hostnames
        shell: bash
        run: |
          set -euo pipefail

          CLOUDFLARE="https://haze.ksmostofa576.workers.dev"
          NETLIFY="https://survivethehaze.netlify.app"

          fail_response() {
            LABEL="$1"; STEP="$2"; STATUS="$3"; FILE="$4"
            echo "::error::$LABEL $STEP failed with HTTP $STATUS"
            [ -f "$FILE" ] && { echo "----- response -----"; head -c 4000 "$FILE"; echo; echo "--------------------"; }
            exit 1
          }

          get_json() {
            LABEL="$1"; STEP="$2"; URL="$3"; ORIGIN="$4"; OUT="$5"; shift 5
            STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -H "Origin: $ORIGIN" "$@" "$URL" || true)
            [ "$STATUS" = "200" ] || fail_response "$LABEL" "$STEP" "$STATUS" "$OUT"
          }

          verify_host() {
            BASE="$1"
            ORIGIN="$2"
            LABEL="$3"
            HOME="/tmp/${LABEL}-home.html"
            CONFIG="/tmp/${LABEL}-config.json"
            BOARD="/tmp/${LABEL}-board.json"
            START_FILE="/tmp/${LABEL}-start.json"
            HEADERS_FILE="/tmp/${LABEL}-headers.txt"
            PLAYER="ci-${LABEL}-$(date +%s)-abcdefghijklmnop"

            echo "=== waiting for $LABEL final production page: $BASE ==="
            ready=0
            for attempt in {1..30}; do
              STATUS=$(curl -sS -o "$HOME" -w '%{http_code}' -H 'cache-control: no-cache' "$BASE/" || true)
              if [ "$STATUS" = "200" ] \
                && grep -q 'BUILD_ID="haze-20260811-global-v1"' "$HOME" \
                && grep -q 'href="/how-to-play.css"' "$HOME" \
                && grep -q 'src="/how-to-play.js"' "$HOME" \
                && grep -q 'requestGameFullscreen' "$HOME" \
                && grep -q 'PERF_PROFILE' "$HOME" \
                && grep -q 'updateAdaptiveQuality(dt)' "$HOME" \
                && grep -q 'enemyRouteScratch' "$HOME" \
                && grep -q 'const sinY=Math.sin(yaw)' "$HOME" \
                && grep -q 'let alive=0;for(const e of enemies)' "$HOME" \
                && grep -q 'IMPACT_POOL_SIZE' "$HOME" \
                && grep -q 'SHARED_ENEMY_GEOMETRIES' "$HOME" \
                && grep -q 'disposeEnemyVisual' "$HOME" \
                && ! grep -q 'vel.push(new THREE.Vector3' "$HOME" \
                && grep -q 'apiJSON("/api/run/start"' "$HOME" \
                && ! grep -q 'API_ORIGIN' "$HOME" \
                && ! grep -q 'window.__HAZE' "$HOME" \
                && ! grep -q 'atob(' "$HOME"; then
                ready=1
                echo "$LABEL final pooled production shell is current on attempt $attempt"
                break
              fi
              echo "$LABEL final build not current yet (attempt $attempt, HTTP $STATUS)"
              sleep 8
            done
            [ "$ready" = "1" ] || fail_response "$LABEL" "final production page readiness" "$STATUS" "$HOME"

            curl -sS -D "$HEADERS_FILE" -o /dev/null -H 'cache-control: no-cache' "$BASE/"
            grep -Eqi '^cache-control:.*(no-cache|max-age=0)' "$HEADERS_FILE" || { echo "::error::$LABEL HTML response lacks forced revalidation"; cat "$HEADERS_FILE"; exit 1; }

            for asset in how-to-play.js how-to-play.css; do
              FILE="/tmp/${LABEL}-${asset}"
              STATUS=$(curl -sS -o "$FILE" -w '%{http_code}' "$BASE/$asset" || true)
              [ "$STATUS" = "200" ] || fail_response "$LABEL" "$asset" "$STATUS" "$FILE"
            done
            grep -q 'Desktop' "/tmp/${LABEL}-how-to-play.js" || { echo "::error::$LABEL how-to-play.js missing Desktop"; exit 1; }
            grep -q 'Mobile' "/tmp/${LABEL}-how-to-play.js" || { echo "::error::$LABEL how-to-play.js missing Mobile"; exit 1; }
            grep -q 'ctlModeGrid' "/tmp/${LABEL}-how-to-play.css" || { echo "::error::$LABEL how-to-play.css missing ctlModeGrid"; exit 1; }

            echo "=== $LABEL API config ==="
            get_json "$LABEL" "GET /api/config" "$BASE/api/config" "$ORIGIN" "$CONFIG"
            cat "$CONFIG"; echo

            echo "=== $LABEL leaderboard ==="
            get_json "$LABEL" "GET /api/leaderboard" "$BASE/api/leaderboard" "$ORIGIN" "$BOARD" -H "X-Haze-Player: $PLAYER"
            cat "$BOARD"; echo

            echo "=== $LABEL ranked start ==="
            STATUS=$(curl -sS -o "$START_FILE" -w '%{http_code}' -X POST "$BASE/api/run/start" \
              -H "Origin: $ORIGIN" \
              -H 'content-type: application/json' \
              --data "{\"playerId\":\"$PLAYER\",\"build\":\"haze-20260811-global-v1\"}" || true)
            [ "$STATUS" = "200" ] || fail_response "$LABEL" "POST /api/run/start" "$STATUS" "$START_FILE"
            cat "$START_FILE"; echo
            node - "$START_FILE" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (typeof data.runToken !== 'string' || data.runToken.length !== 64) throw new Error('ranked run start token missing');
          if (!Number.isFinite(data.startedAt)) throw new Error('ranked run start timestamp missing');
          NODE
          }

          verify_host "$CLOUDFLARE" "$CLOUDFLARE" "cloudflare"
          verify_host "$NETLIFY" "$NETLIFY" "netlify"

          cmp /tmp/cloudflare-home.html /tmp/netlify-home.html || {
            echo "::error::Cloudflare and Netlify are not serving the same frontend bytes"
            exit 1
          }

          node - <<'NODE'
          const fs = require('node:fs');
          let reference = null;
          for (const label of ['cloudflare', 'netlify']) {
            const config = JSON.parse(fs.readFileSync(`/tmp/${label}-config.json`));
            const board = JSON.parse(fs.readFileSync(`/tmp/${label}-board.json`));
            if (config.build !== 'haze-20260811-global-v1') throw new Error(`${label}: wrong live build`);
            if (config.season !== 'night-1') throw new Error(`${label}: wrong live season`);
            if (!['verified-run', 'turnstile+verified-run'].includes(config.protection)) throw new Error(`${label}: invalid protection mode`);
            if (!Array.isArray(board.leaders) || !('player' in board)) throw new Error(`${label}: invalid leaderboard response`);
            if (!reference) reference = { build: config.build, season: config.season, protection: config.protection };
            else if (config.build !== reference.build || config.season !== reference.season || config.protection !== reference.protection) throw new Error('hostnames are not serving one authoritative backend');
            console.log(`${label} final optimized same-origin flow verified: ${config.protection}; ${board.leaders.length} leaders`);
          }
          NODE
