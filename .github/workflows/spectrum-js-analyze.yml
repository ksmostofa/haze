name: Spectrum bundle analyzer
on:
  push:
    branches: [brandmystanley-scraper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/analyze-spectrum.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spectrum-js
          path: customizer.min.js
          if-no-files-found: ignore
